plugins {
    id 'java-library'
    // This plugin handles the ZIP bundling required by the new Central Portal
    id 'com.vanniktech.maven.publish' version '0.28.0'
}

group = 'io.github.gokul-s-ust'
version = '1.0.10'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    // Note: withSourcesJar() and withJavadocJar() are removed because
    // the vanniktech plugin generates these automatically for the publication.
}

repositories {
    mavenCentral()
}

dependencies {
    api 'org.springframework.boot:spring-boot-starter-web:2.7.18'
    api 'org.apache.commons:commons-math3:3.6.1'
    implementation 'com.google.guava:guava:32.1.3-jre'
    implementation 'com.googlecode.owasp-java-html-sanitizer:owasp-java-html-sanitizer:20260101.1'
    compileOnly 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'
}

// Ensure Javadoc errors don't stop the release process
tasks.withType(Javadoc) {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.encoding = 'UTF-8'
}

mavenPublishing {
    // --- GPG FIX RE-APPLIED ---
    // We manually pull the key from the environment and fix the formatting
    // before the plugin tries to use it.
    def rawKey = System.getenv("ORG_GRADLE_PROJECT_signingInMemoryKey")
    if (rawKey != null) {
        // Reconstructs the actual key by replacing literal '\n' with real line breaks
        project.ext["signingInMemoryKey"] = rawKey.replace("\\n", "\n")
    }
    // --------------------------

    publishToMavenCentral(com.vanniktech.maven.publish.SonatypeHost.CENTRAL_PORTAL)
    signAllPublications()

    coordinates("io.github.gokul-s-ust", "lib", version)

    pom {
        name = 'XSS Sanitizer Library'
        description = 'A Spring Boot library for XSS sanitization'
        url = 'https://github.com/GOKUL-S-UST/XSS-Sanitizer-Library'
        licenses {
            license {
                name = 'MIT License'
                url = 'https://opensource.org/licenses/MIT'
            }
        }
        developers {
            developer {
                id = 'GOKUL-S-UST'
                name = 'Gokul S Ganesh'
                email = 'Gokul.SGanesh@ust.com'
            }
        }
        scm {
            connection = 'scm:git:git://github.com/GOKUL-S-UST/XSS-Sanitizer-Library.git'
            developerConnection = 'scm:git:ssh://github.com/GOKUL-S-UST/XSS-Sanitizer-Library.git'
            url = 'https://github.com/GOKUL-S-UST/XSS-Sanitizer-Library'
        }
    }
}