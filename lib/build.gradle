plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    // ADD THIS PLUGIN: It handles the ZIP bundling for the new portal
    id 'com.vanniktech.maven.publish' version '0.28.0'
}

group = 'io.github.gokul-s-ust'
version = '1.0.7' // Bump version again

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
    withSourcesJar()
    withJavadocJar()
}

// Remove the old 'publishing' and 'signing' blocks and replace with this simple config:
mavenPublishing {
    // This helper method sets up the POM and signing automatically
    publishToMavenCentral(com.vanniktech.maven.publish.SonatypeHost.CENTRAL_PORTAL)

    signAllPublications()

    coordinates("io.github.gokul-s-ust", "lib", version)

    pom {
        name = 'XSS Sanitizer Library'
        description = 'A Spring Boot library for XSS sanitization'
        url = 'https://github.com/GOKUL-S-UST/XSS-Sanitizer-Library'
        licenses {
            license {
                name = 'MIT License'
                url = 'https://opensource.org/licenses/MIT'
            }
        }
        developers {
            developer {
                id = 'GOKUL-S-UST'
                name = 'Gokul S Ganesh'
                email = 'Gokul.SGanesh@ust.com'
            }
        }
        scm {
            connection = 'scm:git:git://github.com/GOKUL-S-UST/XSS-Sanitizer-Library.git'
            developerConnection = 'scm:git:ssh://github.com/GOKUL-S-UST/XSS-Sanitizer-Library.git'
            url = 'https://github.com/GOKUL-S-UST/XSS-Sanitizer-Library'
        }
    }
}