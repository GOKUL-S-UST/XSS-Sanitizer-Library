plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
}

group = 'io.github.gokul-s-ust'
version = '1.0.4'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
}

dependencies {
    api 'org.springframework.boot:spring-boot-starter-web:2.7.18'
    api 'org.apache.commons:commons-math3:3.6.1'
    implementation 'com.google.guava:guava:32.1.3-jre'
    implementation 'com.googlecode.owasp-java-html-sanitizer:owasp-java-html-sanitizer:20260101.1'
    compileOnly 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            pom {
                name = 'XSS Sanitizer Library'
                description = 'A Spring Boot library for XSS sanitization'
                url = 'https://github.com/GOKUL-S-UST/XSS-Sanitizer-Library'

                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }

                developers {
                    developer {
                        id = 'GOKUL-S-UST'
                        name = 'Gokul S Ganesh'
                        email = 'Gokul.SGanesh@ust.com'
                    }
                }

                scm {
                    connection = 'scm:git:git://github.com/GOKUL-S-UST/XSS-Sanitizer-Library.git'
                    developerConnection = 'scm:git:ssh://github.com/GOKUL-S-UST/XSS-Sanitizer-Library.git'
                    url = 'https://github.com/GOKUL-S-UST/XSS-Sanitizer-Library'
                }
            }
        }
    }

    repositories {
        maven {
            name = "MavenCentral"
            url = uri("https://s01.oss.sonatype.org/service/local/staging/deploy/maven2/")
            credentials {
                username = System.getenv("MAVEN_USERNAME")
                password = System.getenv("MAVEN_PASSWORD")
            }
        }
    }
}

signing {
    def signingKey = System.getenv("GPG_SIGNING_KEY")
    def signingPassword = System.getenv("GPG_SIGNING_PASSWORD")

    if (signingKey != null && signingPassword != null) {
        useInMemoryPgpKeys(
                signingKey.replace("\\n", "\n"),
                signingPassword
        )
        sign publishing.publications.mavenJava
        println("✅ GPG signing configured")
    } else {
        println("⚠️ GPG signing skipped: key or password not found")
    }
}